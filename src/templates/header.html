<style type="text/css">
  #main-wrapper {
    margin-top: 40px;
  }

  .fake-piskelapp-header {
    position: relative;
    text-align: center;
    height: 40px;
    line-height: 40px;
    font-size: 24px;
    background: black;
    color: gold;
    z-index: 100;
  }

  .piskel-name.piskel-name-saving {
    color: red;
  }

  .new-piskel-desktop {
    position: absolute;

    display: flex;
    top: 7px;
    right: 7px;

    height: 26px;
    width: 26px;

    border-radius: 3px;
    font-size: 22px;
    color: black;
    background: gold;
    text-decoration: none;

    align-items: center;
    justify-content: center;
  }
  a.new-piskel-desktop, a.new-piskel-desktop:visited {
    color: black;
  }

  .header-history-button {
    float: left;
    margin: 5px 0 0 8px;
    height: 30px;
    padding: 0 6px;
    border: none;
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
  }
  .header-history-button:hover {
    background: rgba(255, 255, 255, 0.12);
  }
  .header-history-button img {
    display: block;
    height: 18px;
    width: auto;
  }
  .header-history-button:disabled {
    cursor: default;
  }
  .header-history-button:disabled:hover {
    background: transparent;
  }
  .header-history-button:disabled img {
    filter: grayscale(1);
    opacity: 0.4;
  }
</style>
<div class="fake-piskelapp-header">
  <a
    href="/dashboard"
    title="Go back to FUSE site"
    rel="tooltip"
    style="float:left"
    ><img src="logo.png" alt="FUSE Logo" style="scale:0.75"></a>
  <button
    type="button"
    class="header-history-button header-undo-button"
    title="Undo"
    rel="tooltip"
    ><img src="img/icons/undo.svg" alt="Undo"></button>
  <button
    type="button"
    class="header-history-button header-redo-button"
    title="Redo"
    rel="tooltip"
    ><img src="img/icons/redo.svg" alt="Redo"></button>
  <a
    href="/pixelart"
    target="_blank"
    class="new-piskel-desktop button button-primary"
    title="Create a new sprite"
    rel="tooltip"
    data-placement="left"
    >+</a>
  <span class="piskel-name"></span>
</div>
